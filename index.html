<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Minimal Rain & Cloud Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
    }

    /* Transparent Main Container */
    .tracker-card {
      position: relative;
      background: transparent !important;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      border-radius: 20px;
      overflow: hidden;
    }

    /* Weather Animation Layer (Clouds & Rain) */
    .weather-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 0;
    }

    .tracker-card.running .weather-layer {
      opacity: 1;
    }

    /* ☁️ Minimal SVG Clouds Floating */
    .cloud {
      position: absolute;
      color: rgba(15, 23, 42, 0.22); /* Dark Minimal Cloud Stroke */
      animation: floatCloud linear infinite;
    }

    .cloud svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8; /* Clean thin stroke */
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cloud-1 { top: 8%; left: -30%; width: 55px; height: 35px; animation-duration: 9s; }
    .cloud-2 { top: 18%; left: -40%; width: 42px; height: 28px; animation-duration: 12s; animation-delay: 3s; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(380px); }
    }

    /* 🌧️ Thin Stroke Rain Drops Falling */
    .rain-drop {
      position: absolute;
      width: 1.5px; /* Thin line stroke */
      height: 14px;
      background: linear-gradient(180deg, transparent, rgba(15, 23, 42, 0.35));
      border-radius: 1px;
      animation: fallRain linear infinite;
    }

    .drop-1 { left: 20%; top: -20px; animation-duration: 0.8s; animation-delay: 0.1s; }
    .drop-2 { left: 40%; top: -20px; animation-duration: 1.1s; animation-delay: 0.5s; }
    .drop-3 { left: 60%; top: -20px; animation-duration: 0.9s; animation-delay: 0.3s; }
    .drop-4 { left: 80%; top: -20px; animation-duration: 1.2s; animation-delay: 0.7s; }

    @keyframes fallRain {
      0% { transform: translateY(0) scaleY(1); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(160px) scaleY(1.2); opacity: 0; }
    }

    /* Card Content Stacked on Top */
    .card-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Subject Title - Solid Dark Black */
    .subject-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #0f172a;
      margin-bottom: 14px;
      text-transform: uppercase;
      text-align: center;
    }

    .time-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    /* Status Light Dot (Self-contained Pulsing Dot) */
    .pulse-ring {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444; /* Red when OFF */
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
      transition: background-color 0.4s ease, box-shadow 0.4s ease;
      animation: redBlink 2.2s infinite ease-in-out;
    }

    @keyframes redBlink {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 10px rgba(239, 68, 68, 0.8); }
    }

    .pulse-ring.running {
      background-color: #10b981; /* Green when ON */
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
      animation: greenBlink 1.6s infinite ease-in-out;
    }

    @keyframes greenBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.92); box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
      50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 12px rgba(16, 185, 129, 0.9); }
    }

    /* Timer Numbers - Crisp Black */
    .time-display {
      font-family: 'Space Grotesk', monospace;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: #0f172a;
      font-variant-numeric: tabular-nums;
    }

    /* Minimalist Button for Light Mode */
    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(15, 23, 42, 0.15);
      background-color: rgba(15, 23, 42, 0.04);
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .control-btn:hover {
      background-color: rgba(15, 23, 42, 0.1);
      transform: scale(1.08);
      border-color: rgba(15, 23, 42, 0.3);
    }

    .control-btn:active { transform: scale(0.92); }

    .btn-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="tracker-card" id="main-card">
    
    <!-- Weather Layer: Clouds & Raindrops -->
    <div class="weather-layer">
      <!-- Clouds -->
      <div class="cloud cloud-1">
        <svg viewBox="0 0 24 24"><path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.156 20.206 10.231 17.922 10.024C17.399 6.588 14.42 4 10.833 4C6.949 4 3.738 6.949 3.402 10.74C1.488 11.455 0.1 13.28 0.1 15.417C0.1 18.224 2.376 20.5 5.183 20.5H17.5V19Z"/></svg>
      </div>
      <div class="cloud cloud-2">
        <svg viewBox="0 0 24 24"><path d="M17.5 19C19.9853 19 22 16.9853 22 14.5C22 12.156 20.206 10.231 17.922 10.024C17.399 6.588 14.42 4 10.833 4C6.949 4 3.738 6.949 3.402 10.74C1.488 11.455 0.1 13.28 0.1 15.417C0.1 18.224 2.376 20.5 5.183 20.5H17.5V19Z"/></svg>
      </div>

      <!-- Raindrops -->
      <div class="rain-drop drop-1"></div>
      <div class="rain-drop drop-2"></div>
      <div class="rain-drop drop-3"></div>
      <div class="rain-drop drop-4"></div>
    </div>

    <!-- Main Card Content -->
    <div class="card-content">
      <div class="subject-title" id="subject-tag">GENERAL WORK</div>

      <div class="time-container">
        <div class="pulse-ring" id="indicator"></div>
        <div class="time-display" id="display">00:00:00</div>
      </div>

      <button class="control-btn" id="btn-toggle" aria-label="Start or Pause">
        <svg class="btn-icon" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="btn-icon" id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const urlParams = new URLSearchParams(window.location.search);
    const subjectId = (urlParams.get('sub') || 'general').toLowerCase();

    const subjectNames = {
      'bsns111': 'BSNS 111: Business & Society',
      'bsns113': 'BSNS 113: Economics',
      'bsns114': 'BSNS 114: Finance',
      'comp121': 'COMP 121: Programming',
      'futureplan': 'Future Plan',
      'falahagro': 'Falah Agro Farm',
      'choloabroad': 'Cholo Abroad',
      'general': 'GENERAL WORK'
    };

    document.getElementById('subject-tag').textContent = subjectNames[subjectId] || subjectId.toUpperCase();

    const firebaseConfig = {
      databaseURL: "https://mynotiontime-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const studyRef = ref(db, `study_timers/${subjectId}`);

    let elapsedTime = 0;
    let timerInterval = null;
    let isRunning = false;

    const displayEl = document.getElementById('display');
    const toggleBtn = document.getElementById('btn-toggle');
    const playIcon = document.getElementById('icon-play');
    const pauseIcon = document.getElementById('icon-pause');
    const indicatorEl = document.getElementById('indicator');
    const mainCardEl = document.getElementById('main-card');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const pad = (num) => String(num).padStart(2, '0');
      return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    }

    function updateDisplay() {
      displayEl.textContent = formatTime(elapsedTime);
    }

    onValue(studyRef, (snapshot) => {
      if (!isRunning && snapshot.exists()) {
        elapsedTime = snapshot.val();
        updateDisplay();
      }
    });

    function saveToCloud() {
      set(studyRef, elapsedTime);
    }

    function startTimer() {
      isRunning = true;
      const startTime = Date.now() - elapsedTime;

      timerInterval = setInterval(() => {
        elapsedTime = Date.now() - startTime;
        updateDisplay();
      }, 200);

      setInterval(() => {
        if (isRunning) saveToCloud();
      }, 5000);

      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      
      indicatorEl.classList.add('running');
      mainCardEl.classList.add('running');
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      timerInterval = null;

      saveToCloud();

      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      
      indicatorEl.classList.remove('running');
      mainCardEl.classList.remove('running');
    }

    toggleBtn.addEventListener('click', () => {
      if (isRunning) {
        stopTimer();
      } else {
        startTimer();
      }
    });
  </script>
</body>
</html>
