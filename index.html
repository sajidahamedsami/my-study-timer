<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Multi-Timer Tracker</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
    }

    .tracker-card {
      background: transparent;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .subject-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #38bdf8;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-align: center;
    }

    .motivation-text {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 12px;
      text-align: center;
    }

    .time-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      position: relative;
    }

    .pulse-ring {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #10b981;
      opacity: 0.3;
      transition: all 0.4s ease;
    }

    .pulse-ring.running {
      opacity: 1;
      box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
      animation: neonAura 2s infinite ease-in-out;
    }

    @keyframes neonAura {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1.15); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .time-display {
      font-family: 'Space Grotesk', monospace;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
      color: #64748b;
      font-variant-numeric: tabular-nums;
    }

    .control-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background-color: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      outline: none;
    }

    .control-btn:hover {
      background-color: rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      transform: scale(1.08);
    }

    .control-btn:active { transform: scale(0.92); }

    .btn-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .sync-status {
      font-size: 0.7rem;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="tracker-card">
    <div class="subject-title" id="subject-tag">GENERAL WORK</div>
    <div class="motivation-text">Stay Focused</div>

    <div class="time-container">
      <div class="pulse-ring" id="indicator"></div>
      <div class="time-display" id="display">00:00:00</div>
    </div>

    <button class="control-btn" id="btn-toggle" aria-label="Start or Pause">
      <svg class="btn-icon" id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="btn-icon" id="icon-pause" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <div class="sync-status" id="sync-status">Cloud Sync Ready</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Detect Subject/Project from URL (e.g., ?sub=futureplan)
    const urlParams = new URLSearchParams(window.location.search);
    const subjectId = (urlParams.get('sub') || 'general').toLowerCase();

    // Map subject & project IDs to readable titles
    const subjectNames = {
      // Subjects
      'bsns111': 'BSNS 111: Business & Society',
      'bsns113': 'BSNS 113: Economics',
      'bsns114': 'BSNS 114: Finance',
      'comp121': 'COMP 121: Programming',
      
      // Projects & Plans
      'futureplan': 'Future Plan',
      'falahagro': 'Falah Agro Farm',
      'choloabroad': 'Cholo Abroad',
      
      'general': 'GENERAL WORK'
    };

    document.getElementById('subject-tag').textContent = subjectNames[subjectId] || subjectId.toUpperCase();

    const firebaseConfig = {
      databaseURL: "https://mynotiontime-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const studyRef = ref(db, `study_timers/${subjectId}`);

    let elapsedTime = 0;
    let timerInterval = null;
    let isRunning = false;

    const displayEl = document.getElementById('display');
    const toggleBtn = document.getElementById('btn-toggle');
    const playIcon = document.getElementById('icon-play');
    const pauseIcon = document.getElementById('icon-pause');
    const indicatorEl = document.getElementById('indicator');
    const syncStatusEl = document.getElementById('sync-status');

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      const pad = (num) => String(num).padStart(2, '0');
      return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
    }

    function updateDisplay() {
      displayEl.textContent = formatTime(elapsedTime);
    }

    onValue(studyRef, (snapshot) => {
      if (!isRunning && snapshot.exists()) {
        elapsedTime = snapshot.val();
        updateDisplay();
        syncStatusEl.textContent = "Synced from Cloud";
      }
    });

    function saveToCloud() {
      set(studyRef, elapsedTime);
    }

    function startTimer() {
      isRunning = true;
      const startTime = Date.now() - elapsedTime;

      timerInterval = setInterval(() => {
        elapsedTime = Date.now() - startTime;
        updateDisplay();
      }, 200);

      setInterval(() => {
        if (isRunning) saveToCloud();
      }, 5000);

      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      indicatorEl.classList.add('running');
      syncStatusEl.textContent = "Tracking Live...";
    }

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      timerInterval = null;

      saveToCloud();

      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      indicatorEl.classList.remove('running');
      syncStatusEl.textContent = "Saved to Cloud";
    }

    toggleBtn.addEventListener('click', () => {
      if (isRunning) {
        stopTimer();
      } else {
        startTimer();
      }
    });
  </script>
</body>
</html>
